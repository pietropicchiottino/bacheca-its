# ---------------------------------------------------------------------------
#  RELEASE - porta online la bacheca.
# ---------------------------------------------------------------------------

name: Release
on:
  push:
    branches: [main]

  # TODO 6 - Aggiungi la partenza a mano (workflow_dispatch) con rollback
  workflow_dispatch:
    inputs:
      versione_da_ripubblicare:
        description: 'SHA corto del commit da ripubblicare (Rollback)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  # -------------------------------------------------- 1. costruisci UNA volta
  build:
    name: Costruisci e sigilla l'artefatto
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.versione.outputs.valore }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TODO 7 - Rollback se è stata indicata una versione
      - name: Rollback al commit selezionato
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.versione_da_ripubblicare != '' }}
        run: git checkout ${{ inputs.versione_da_ripubblicare }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calcola l'etichetta di versione
        id: versione
        run: |
          VALORE="$(git rev-parse --short=7 HEAD)"
          echo "valore=$VALORE" >> "$GITHUB_OUTPUT"
          echo "VERSIONE=$VALORE" >> "$GITHUB_ENV"
          echo "### Bacheca ITS - build \`$VALORE\`" >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sito
          path: dist/
          retention-days: 30

  # -------------------------------------------------- 2. collauda l'artefatto
  collaudo:
    name: Collaudo sull'artefatto, non sul codice
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sito
          path: dist

      - name: La pagina esiste, non e' vuota e ha il foglio di stile
        run: |
          test -s dist/index.html || { echo "index.html mancante o vuoto"; exit 1; }
          test -s dist/style.css  || { echo "style.css mancante"; exit 1; }
          grep -q "Bacheca avvisi" dist/index.html || { echo "titolo non trovato"; exit 1; }
          echo "artefatto collaudato"

  # -------------------------------------------------- 3. l'umano nel mezzo (TODO 8)
  approvazione:
    name: Approvazione umana prima della produzione
    needs: [ build, collaudo ]
    runs-on: ubuntu-latest
    environment: produzione
    steps:
      - name: Approvata la release
        run: echo "Approvata la release da parte dell'operatore!"

  # -------------------------------------------------- 4. pubblica (TODO 9 e 10)
  pubblica:
    name: Pubblica sul branch gh-pages
    needs: [ build, approvazione ]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica l'artefatto
        uses: actions/download-artifact@v4
        with:
          name: sito
          path: sito

      - name: Deploy su GitHub Pages / Branch gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sito
